services:
 redis:
  image: redis:7-alpine
  restart: unless-stopped
  command: redis-server --appendonly yes
  volumes: [redis_data:/data]
 postgres:
  image: postgres:16-alpine
  restart: unless-stopped
  environment:
   POSTGRES_DB: telegram_factory
   POSTGRES_USER: factory
   POSTGRES_PASSWORD: CHANGE_ME
  volumes: [postgres_data:/var/lib/postgresql/data]
 web:
  build: .
  restart: unless-stopped
  command: python run_web.py
  env_file: .env
  depends_on: [redis,postgres]
 main:
  build: .
  restart: unless-stopped
  command: python main.py
  env_file: .env
  depends_on: [redis,postgres]
 worker-1:
  build: .
  restart: unless-stopped
  command: python worker.py
  env_file: .env
  environment: {WORKER_ID: worker-1}
  depends_on: [redis,postgres]
 worker-2:
  build: .
  restart: unless-stopped
  command: python worker.py
  env_file: .env
  environment: {WORKER_ID: worker-2}
  depends_on: [redis,postgres]
 prometheus:
  image: prom/prometheus:v3.5.0
  restart: unless-stopped
  volumes: ['./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
  depends_on: [web,worker-1,worker-2]
 grafana:
  image: grafana/grafana:12.1.1
  restart: unless-stopped
  volumes: ['grafana_data:/var/lib/grafana','./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro','./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro']
  depends_on: [prometheus]
 caddy:
  image: caddy:2-alpine
  restart: unless-stopped
  environment: {DOMAIN: ${DOMAIN}}
  ports: ['80:80','443:443']
  volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro','caddy_data:/data','caddy_config:/config']
  depends_on: [web]
volumes: {redis_data: {}, postgres_data: {}, grafana_data: {}, caddy_data: {}, caddy_config: {}}

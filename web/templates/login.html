
{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:520px;margin:70px auto;text-align:center">
<h2>🔐 الدخول إلى Telegram Bot Factory</h2>
<p class="muted">سجّل الدخول باستخدام حساب Telegram.</p>
{% if bot_username %}
<script async src="https://telegram.org/js/telegram-widget.js?22"
        data-telegram-login="{{ bot_username }}"
        data-size="large"
        data-userpic="false"
        data-auth-url="/auth/telegram"
        data-request-access="write"></script>
{% else %}
<p style="color:#b42318">لم يتم إعداد TELEGRAM_LOGIN_BOT_USERNAME في .env</p>
{% endif %}
</div>
{% endblock %}
